# yaml-language-server: $schema=https://raw.githubusercontent.com/wellcomecollection/deploy-tracker/main/schema/deploy-tracker.schema.json
#
# Reports deployments of this repository to Slack. See
# https://github.com/wellcomecollection/deploy-tracker for what the tracker does.
#
# A deployment carries the whole commit, so every pull request in its range is
# reported. Only `paths` narrow that, and only for a service some environment
# leaves out, which here is the snapshot generator.
#
# identifiers/ deploys from GitHub Actions rather than this pipeline, so it is
# not a service here yet.
version: 1

slack:
  channel: "#wc-platform-deploys"

services:
  search:
    manifest: /catalogue/management/search/manifest
  items:
    manifest: /catalogue/management/items/manifest
  concepts:
    manifest: /catalogue/management/concepts/manifest
  # Fronted by the identity account's gateway, so its manifest is not reachable.
  requests:
  # A queue worker with no HTTP surface, deployed by the prod build alone. Its own
  # directory and nothing else: the shared Scala it is built from is shared with
  # services stage does deploy, and listing it here would hide those changes.
  snapshot-generator:
    paths: [snapshots/snapshot_generator/]

environments:
  stage:
    host: https://api-stage.wellcomecollection.org
    deploys: [search, items, concepts, requests]
  prod:
    host: https://api.wellcomecollection.org
    deploys: [search, items, concepts, requests, snapshot-generator]
    promote_from: stage

# Off for the first week, as wellcomecollection.org did, so the Slack feed can be
# judged before the tracker starts writing on pull requests. Add overdue on prod
# when they go on, since the prod gate is a manual block step.
labels: false
pr_comments: false
