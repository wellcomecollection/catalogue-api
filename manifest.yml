# Backplane (backplane/v1) description of this repository's software, gathered into
# https://github.com/wellcomecollection/catalog, where every repository's
# entities share one namespace, so the names carry the repository prefix.
apiVersion: backplane/v1
kind: System
metadata:
  name: catalogue-api
  description: The public API serving the catalogue of works, images and concepts
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
spec:
  owner: team:default/digital-platform
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-search
  description: Serves works and images, and the queries behind them
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/search/
    backplane/dora-paths: search, common
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/catalogue-api/blob/main/search/docs/runbook.md
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - resource:catalogue-pipeline-elasticsearch
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      checkpoints:
        - url: https://api-stage.wellcomecollection.org/catalogue/management/search/manifest
      github:
        task: "deploy:weco"
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      checkpoints:
        - url: https://api.wellcomecollection.org/catalogue/management/search/manifest
      github:
        task: "deploy:weco"
  slos:
    # Agreed 2026-11-13; see docs adr/service_levels.md. Measured gateway-wide.
    - name: availability
      description: API requests not answered with a 5xx
      objective: 99.5
      window: 28d
      sli:
        source: cloudwatch
        good: "Count - 5XXError"
        total: "Count"
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-items
  description: Serves the live availability of the items on a work
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/items/
    backplane/dora-paths: items, common
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/catalogue-api/blob/main/items/docs/runbook.md
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - ref: component:catalogue-api-search
      description: Work lookup
    - ref: component:content-api
      criticality: soft
      description: Venue opening times
    - ref: resource:sierra
      criticality: soft
      description: Live availability; falls back to indexed availability
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      checkpoints:
        - url: https://api-stage.wellcomecollection.org/catalogue/management/items/manifest
      github:
        task: "deploy:weco"
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      checkpoints:
        - url: https://api.wellcomecollection.org/catalogue/management/items/manifest
      github:
        task: "deploy:weco"
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-concepts
  description: Serves the people, places, subjects and genres used to describe works
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/concepts/
    backplane/dora-paths: concepts, common
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - resource:catalogue-pipeline-elasticsearch
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      checkpoints:
        - url: https://api-stage.wellcomecollection.org/catalogue/management/concepts/manifest
      github:
        task: "deploy:weco"
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      checkpoints:
        - url: https://api.wellcomecollection.org/catalogue/management/concepts/manifest
      github:
        task: "deploy:weco"
---
# Deployed from here but fronted by the identity account's gateway, so its
# version endpoint is not reachable and it has no checkpoint.
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-requests
  description: Places and lists holds on items in the library stores
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/requests/
    backplane/dora-paths: requests, common
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/catalogue-api/blob/main/items/docs/runbook.md
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - ref: component:catalogue-api-search
      description: Item lookup
    - ref: resource:sierra
      description: Places and lists holds
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      github:
        task: "deploy:weco"
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      github:
        task: "deploy:weco"
---
# A queue worker with no HTTP surface, so nothing to check. Deployed by the prod
# build alone.
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-snapshot-generator
  description: Writes the nightly public snapshots of works and images
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/snapshots/snapshot_generator/
    backplane/dora-paths: snapshots/snapshot_generator, common
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - ref: component:catalogue-api-search
      description: Reads the index config from /_elasticConfig
    - resource:catalogue-pipeline-elasticsearch
    - ref: resource:reporting-elasticsearch
      criticality: soft
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: prod
      tier: production
      github:
        task: "deploy:weco"
---
apiVersion: backplane/v1
kind: Component
metadata:
  name: catalogue-api-identifiers
  description: Resolves catalogue identifiers, deployed from GitHub Actions
  annotations:
    github.com/project-slug: wellcomecollection/catalogue-api
    backstage.io/source-location: url:https://github.com/wellcomecollection/catalogue-api/tree/main/identifiers/
    backplane/dora-paths: identifiers
spec:
  type: service
  lifecycle: production
  owner: team:default/digital-platform
  system: system:catalogue-api
  dependsOn:
    - resource:catalogue-pipeline-id-registry
    - resource:api-wellcomecollection-org-cloudfront
  environments:
    - name: stage
      tier: staging
      checkpoints:
        - url: https://identifiers.api-stage.wellcomecollection.org/management/manifest
      github:
        task: deploy
    - name: prod
      tier: production
      promotesFrom: stage
      # Working hours waiting on stage before a nudge, since the prod gate is manual
      overdue: 2h
      checkpoints:
        - url: https://identifiers.api-prod.wellcomecollection.org/management/manifest
      github:
        task: deploy
