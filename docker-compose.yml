version: "3.3"

services:
  smoke_test_catalogue_api_stage:
    image: smoke_test_catalogue_api_stage
    build:
      context: ./smoke_tests
  diff_tool:
    image: diff_tool
    build:
      context: ./diff_tool
    volumes:
      - "./reports:/usr/src/app/reports"
  concepts:
    image: uk.ac.wellcome/concepts:${CONTAINER_TAG:-test}
    build:
      context: .
      dockerfile: ./concepts/Dockerfile
      args:
        # Buildkite sets BUILDKITE_COMMIT; empty locally, which the app reads as unknown.
        BUILD_COMMIT: ${BUILDKITE_COMMIT:-}
