# Deployments for the catalogue API services.
#
# Buildkite runs this pipeline when a GitHub Deployment is created for this
# repository, because the pipeline's trigger mode is "deployment". Builds started
# that way get their deployment_status transitions posted by Buildkite itself, so
# the only thing this file has to do for the deploy tracker is set the
# environment URL as build meta-data.
#
# The build pipeline creates the stage Deployment when main is green. This
# pipeline creates the prod one, once someone has read the diff and unblocked it.
#
# BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT is "stage" or "prod", which is also the
# suffix of the ECR env tag and the prefix of the ECS service names.
#
# Deployment variables are written $$VAR inside commands so the agent's shell
# expands them at run time, and $VAR in labels and concurrency groups, which
# Buildkite resolves when it reads this file. $BUILDKITE_COMMIT is deliberately
# the single $ form everywhere: pinning the sha at upload time is what stops a
# later build's image being deployed while this one waits at the block step.

steps:
  - label: "Check the deployment"
    command: |
      TASK="$${BUILDKITE_GITHUB_DEPLOYMENT_TASK:-}"
      ENV="$${BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT:-}"

      # A build started any other way, from the Buildkite UI for instance, has
      # none of these set and stops here rather than deploying something.
      if [[ "$$TASK" != "deploy:weco" ]]
      then
        echo "Refusing to deploy: task is '$$TASK', expected 'deploy:weco'" >&2
        exit 1
      fi

      case "$$ENV" in
        stage | prod) ;;
        *)
          echo "Refusing to deploy: unknown environment '$$ENV'" >&2
          exit 1
          ;;
      esac

      echo "Deploying ref.$BUILDKITE_COMMIT to $$ENV"

    agents:
      queue: nano

  - wait

  - label: "Deploy (catalogue $BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT)"
    concurrency: 1
    concurrency_group: "catalogue/deploy-$BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT"
    command: |
      ENV="$$BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT"

      case "$$ENV" in
        prod) HOSTNAME="api.wellcomecollection.org" ;;
        stage) HOSTNAME="api-stage.wellcomecollection.org" ;;
      esac

      buildkite-agent meta-data set \
        "github_deployment_status:environment_url" \
        "https://$$HOSTNAME/catalogue/v2"

      ENV_TAG="env.$$ENV" LATEST_TAG="ref.$BUILDKITE_COMMIT" ./builds/update_ecr_image_tag.sh \
        uk.ac.wellcome/concepts \
        uk.ac.wellcome/items \
        uk.ac.wellcome/search

      CLUSTER="catalogue-api-2021-04-26" ./builds/deploy_ecs_services.sh \
        "$$ENV-concepts-api" \
        "$$ENV-items-api" \
        "$$ENV-search-api"

    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"

    agents:
      queue: nano

  - label: "Deploy (requests $BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT)"
    concurrency: 1
    concurrency_group: "requests/deploy-$BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT"
    command: |
      ENV="$$BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT"

      ENV_TAG="env.$$ENV" LATEST_TAG="ref.$BUILDKITE_COMMIT" ./builds/update_ecr_image_tag.sh \
        uk.ac.wellcome/requests

      CLUSTER="identity-$$ENV" ./builds/deploy_ecs_services.sh \
        "requests-$$ENV"

    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::770700576653:role/identity-ci"

    agents:
      queue: nano

  # The snapshot generator has no stage counterpart; it runs only in prod.
  - label: "Deploy (snapshot generator)"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "prod"
    concurrency: 1
    concurrency_group: snapshots/deploy-prod
    command: |
      ENV_TAG="env.prod" LATEST_TAG="ref.$BUILDKITE_COMMIT" ./builds/update_ecr_image_tag.sh \
        uk.ac.wellcome/snapshot_generator

      CLUSTER="data-api" ./builds/deploy_ecs_services.sh \
        snapshot_generator-prod

    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"

    agents:
      queue: nano

  - wait

  - label: "Smoke Tests: Catalogue API (stage)"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::130871440101:role/experience-ci"
      - docker-compose#v3.5.0:
          run: smoke_test_catalogue_api_stage
          command: ["yarn", "run", "smokeTestCatalogueApiStage"]
          env:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
            - AWS_REGION=eu-west-1

  - label: "Smoke Tests: Catalogue API (prod)"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "prod"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::130871440101:role/experience-ci"
      - docker-compose#v3.5.0:
          run: smoke_test_catalogue_api_stage
          command: ["yarn", "run", "smokeTestCatalogueApiProd"]
          env:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
            - AWS_REGION=eu-west-1

  - label: "E2E Tests: PROD Front-end / STAGE Catalogue API"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    trigger: "experience-e2e"
    build:
      env:
        PLAYWRIGHT_BASE_URL: https://wellcomecollection.org
        USE_STAGE_APIS: true

  - label: "E2E Tests: PROD Front-end / PROD Catalogue API"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "prod"
    trigger: "experience-e2e"
    build:
      env:
        PLAYWRIGHT_BASE_URL: https://wellcomecollection.org

  - label: "Rank tests: Catalogue API STAGE ({{matrix}})"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    matrix:
      - "works"
      - "images"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"
      - ecr#v2.7.0:
          login: true
      - docker#v5.8.0:
          image: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/weco/rank:latest
          command:
            - "test"
            - "--content-type={{matrix}}"
            - "--cluster=pipeline-stage"
            - "--query=https://api-stage.wellcomecollection.org/catalogue/v2"
          mount-checkout: false
          always-pull: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          shell: false

  - label: "Rank tests: Catalogue API PROD ({{matrix}})"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "prod"
    matrix:
      - "works"
      - "images"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"
      - ecr#v2.7.0:
          login: true
      - docker#v5.8.0:
          image: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/weco/rank:latest
          command:
            - "test"
            - "--content-type={{matrix}}"
            - "--cluster=pipeline-prod"
            - "--query=https://api.wellcomecollection.org/catalogue/v2"
          mount-checkout: false
          always-pull: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          shell: false

  - wait

  # Everything below runs in the stage build only, and ends by asking GitHub for
  # a prod Deployment, which starts this pipeline again with environment=prod.
  - label: "Diff tool: Compare stage & prod"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    artifact_paths: "reports/*"
    plugins:
      - docker-compose#v3.5.0:
          run: diff_tool
    agents:
      queue: nano

  - wait

  - label: "annotate with diff"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    command: |
      buildkite-agent artifact download reports/api_diff.txt .
      if grep -q '✖' reports/api_diff.txt; then
        export STYLE=warning;
      else
        export STYLE=info;
      fi
      (echo '```term' && cat reports/api_diff.txt && echo '```') | buildkite-agent annotate --style=$$STYLE
    agents:
      queue: nano

  - block: ":rocket: Deploy to prod?"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    prompt: "Deploying ref.$BUILDKITE_COMMIT: Have you checked staging & diff-tool?"

  - label: "Trigger prod deployment"
    if: build.env("BUILDKITE_GITHUB_DEPLOYMENT_ENVIRONMENT") == "stage"
    plugins:
      - wellcomecollection/github-deployments#v0.3.0:
          assume_role: "arn:aws:iam::756629837203:role/catalogue-ci"
          environment: prod
          ref: "${BUILDKITE_COMMIT}"
    agents:
      queue: nano
