# The deploy tracker reads GitHub Deployments, and this pipeline creates and
# completes its own rather than letting Buildkite do it from a deployment
# trigger. Nothing in this repository listens for Deployment events, so the
# identifiers API's Actions workflow can deploy alongside these pipelines
# without either producer starting or reporting on the other's work.
steps:
  - label: "Deploy (catalogue stage)"
    key: "deploy-catalogue-stage"
    branches: "main"
    concurrency: 1
    concurrency_group: catalogue/deploy-stage
    command: |
      ENV_TAG="env.stage" LATEST_TAG="ref.$BUILDKITE_COMMIT" ./builds/update_ecr_image_tag.sh \
        uk.ac.wellcome/concepts \
        uk.ac.wellcome/items \
        uk.ac.wellcome/search

      CLUSTER="catalogue-api-2021-04-26" ./builds/deploy_ecs_services.sh \
        stage-concepts-api \
        stage-items-api \
        stage-search-api

    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"
      # Creates the stage Deployment and posts in_progress before the command
      # above, then failure if it fails. No assume_role: the step is already
      # catalogue-ci, and that role carries the plugin's secret access.
      - wellcomecollection/github-deployments#v0.4.0:
          environment: stage
          ref: "${BUILDKITE_COMMIT}"
          wrap: true

    agents:
      queue: nano

  - label: "Deploy (requests stage)"
    key: "deploy-requests-stage"
    branches: "main"
    concurrency: 1
    concurrency_group: requests/deploy-stage
    command: |
      ENV_TAG="env.stage" LATEST_TAG="ref.$BUILDKITE_COMMIT" ./builds/update_ecr_image_tag.sh \
        uk.ac.wellcome/requests
      CLUSTER="identity-stage" ./builds/deploy_ecs_services.sh \
        requests-stage

    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::770700576653:role/identity-ci"

    agents:
      queue: nano

  - wait

  - label: "Smoke Tests: Catalogue API (stage)"
    key: "smoke-tests-stage"
    branches: "main"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::130871440101:role/experience-ci"
      - docker-compose#v3.5.0:
          run: smoke_test_catalogue_api_stage
          command: ["yarn", "run", "smokeTestCatalogueApiStage"]
          env:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
            - AWS_REGION=eu-west-1

  - label: "E2E Tests: PROD Front-end / STAGE Catalogue API"
    branches: "main"
    trigger: "experience-e2e"
    build:
      env:
        PLAYWRIGHT_BASE_URL: https://wellcomecollection.org
        USE_STAGE_APIS: true

  - label: "Rank tests: Catalogue API STAGE ({{matrix}})"
    matrix:
      - "works"
      - "images"
    plugins:
      - wellcomecollection/aws-assume-role#v0.2.2:
          role: "arn:aws:iam::756629837203:role/catalogue-ci"
      - ecr#v2.7.0:
          login: true
      - docker#v5.8.0:
          image: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/weco/rank:latest
          command:
            - "test"
            - "--content-type={{matrix}}"
            - "--cluster=pipeline-stage"
            - "--query=https://api-stage.wellcomecollection.org/catalogue/v2"
          mount-checkout: false
          always-pull: true
          propagate-environment: true
          propagate-aws-auth-tokens: true
          shell: false

  - label: "Report the stage deployment"
    branches: "main"
    # Runs after a failure too, which is the point: without it a failed deploy
    # leaves the Deployment at in_progress with nothing to resolve it.
    depends_on:
      - "deploy-catalogue-stage"
      - "deploy-requests-stage"
      - "smoke-tests-stage"
    allow_dependency_failure: true
    # Rank and e2e results are deliberately not read. They measure search
    # quality and the front end against this deploy, not whether it landed.
    command: |
      .buildkite/scripts/report_deployment.sh stage \
        deploy-catalogue-stage \
        deploy-requests-stage \
        smoke-tests-stage
    agents:
      queue: nano

  - wait

  - label: trigger prod deploy
    branches: "main"
    trigger: "catalogue-api-deploy-prod"
    async: true
    build:
      message: "${BUILDKITE_MESSAGE}"
      commit: "${BUILDKITE_COMMIT}"
      branch: "${BUILDKITE_BRANCH}"
      env:
        BUILDKITE_PULL_REQUEST: "${BUILDKITE_PULL_REQUEST}"
        BUILDKITE_PULL_REQUEST_BASE_BRANCH: "${BUILDKITE_PULL_REQUEST_BASE_BRANCH}"
        BUILDKITE_PULL_REQUEST_REPO: "${BUILDKITE_PULL_REQUEST_REPO}"
