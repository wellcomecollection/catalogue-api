[project]
name = "identifiers-api"
version = "0.1.0"
description = "Read-only canonical <-> source identifier lookup (RFC 083 ID Registry projection)"
requires-python = ">=3.12,<3.13"
# No runtime dependencies: the core is pure stdlib, and the prototype DB is
# SQLite (also stdlib). The production target swaps the SQLite Repository for an
# Aurora/RDS-Data-API implementation; nothing in `core` would change.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "openapi-core>=0.19",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6",
]
# Bonus: validate the *running* app against the contract (see README).
# Kept out of the default dev group because schemathesis pulls a large tree.
bonus = [
    "schemathesis>=3.36",
]
# Only needed to run against the real Aurora ID Registry (IDENTIFIERS_BACKEND=rds).
# The SQLite path and the whole test suite need no boto3.
rds = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
