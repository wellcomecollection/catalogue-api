name: "Identifiers API: Deploy"

on:
  workflow_call:
    inputs:
      deploy_tag:
        description: "Image tag to deploy (e.g. a commit SHA)"
        required: true
        type: string
    secrets:
      IDENTIFIERS_CI_ROLE_ARN:
        description: "Role ARN to assume for updating the Lambda"
        required: true
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Image tag to deploy (e.g. a commit SHA)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Lambda rejects concurrent code updates, so serialise deploys.
concurrency:
  group: identifiers-deploy
  cancel-in-progress: false

jobs:
  deploy-identifiers-lambda:
    runs-on: ubuntu-latest
    # Deploys only from main. Pull requests never reach here, so there is no
    # need to guard on the role secret existing.
    if: github.ref == 'refs/heads/main'
    # GitHub creates the Deployment and posts every status itself, including on
    # cancellation, which is what the deploy tracker reads.
    environment:
      name: stage
      url: https://identifiers.api-stage.wellcomecollection.org
    steps:
      - uses: wellcomecollection/.github/.github/actions/deploy-lambda-image@main
        with:
          lambda_name: identifiers-api-stage
          registry: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: identifiers
          deploy_tag: ${{ inputs.deploy_tag }}
          role_to_assume: ${{ secrets.IDENTIFIERS_CI_ROLE_ARN }}

  deploy-identifiers-lambda-prod:
    runs-on: ubuntu-latest
    # Prod follows a stage deploy that worked, never on its own.
    needs: [deploy-identifiers-lambda]
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
      url: https://identifiers.api-prod.wellcomecollection.org
    steps:
      - uses: wellcomecollection/.github/.github/actions/deploy-lambda-image@main
        with:
          lambda_name: identifiers-api-prod
          registry: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: identifiers
          deploy_tag: ${{ inputs.deploy_tag }}
          role_to_assume: ${{ secrets.IDENTIFIERS_CI_ROLE_ARN }}
