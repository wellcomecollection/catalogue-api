name: "Items API v3: Check spec"

on:
  push:
    branches: [main]
    paths:
      - "items_v3/**"
      - "reference/catalogue.yaml"
      - "reference/redocly-strip-aws.js"
      - "redocly.yaml"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/items-v3-ci.yml"
  pull_request:
    paths:
      - "items_v3/**"
      - "reference/catalogue.yaml"
      - "reference/redocly-strip-aws.js"
      - "redocly.yaml"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/items-v3-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: yarn lint:openapi
