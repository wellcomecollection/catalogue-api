name: "Identifiers API: Build and Test"

on:
  push:
    branches: [main]
    paths:
      - "identifiers/**"
      - ".github/workflows/identifiers-ci.yml"
      - ".github/workflows/identifiers-deploy.yml"
  pull_request:
    paths:
      - "identifiers/**"
      - ".github/workflows/identifiers-ci.yml"
      - ".github/workflows/identifiers-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wellcomecollection/.github/.github/actions/python_check@main
        with:
          folder: identifiers

  check-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: yarn lint:openapi

  build-identifiers-image:
    runs-on: ubuntu-latest
    needs: [python-checks]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: wellcomecollection/.github/.github/actions/docker-build-and-push@main
        with:
          registry: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          folder: identifiers
          target: identifiers
          dockerfile: lambda.Dockerfile
          tag: ${{ github.sha }}
          build_args: BUILD_COMMIT=${{ github.sha }}
          role_to_assume: ${{ secrets.IDENTIFIERS_CI_ROLE_ARN }}
          # Pull requests build without publishing, which also covers dependabot
          # and fork runs, where no repo secret is available.
          push: ${{ github.ref == 'refs/heads/main' && secrets.IDENTIFIERS_CI_ROLE_ARN != '' }}

      # An unrecognised action input is a warning rather than an error, and the
      # action is pinned to @main, so a rename upstream would quietly publish an
      # image with no commit in it. The manifest would then report "unknown" and
      # the deploy tracker would call the service permanently behind, with
      # nothing failing to say why.
      - name: Check the commit reached the image
        run: |
          baked=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "identifiers:$GITHUB_SHA" | sed -n 's/^BUILD_COMMIT=//p')
          if [ "$baked" != "$GITHUB_SHA" ]; then
            echo "::error::image has BUILD_COMMIT='$baked', expected '$GITHUB_SHA'"
            exit 1
          fi
          echo "BUILD_COMMIT=$baked"

  deploy:
    # Only a merge, so dispatching this workflow rebuilds without deploying.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-identifiers-image, check-spec]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/identifiers-deploy.yml
    with:
      deploy_tag: ${{ github.sha }}
    secrets:
      IDENTIFIERS_CI_ROLE_ARN: ${{ secrets.IDENTIFIERS_CI_ROLE_ARN }}
