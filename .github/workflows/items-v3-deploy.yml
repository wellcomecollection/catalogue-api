name: "Items API v3: Deploy"

on:
  workflow_call:
    inputs:
      deploy_tag:
        description: "Image tag to deploy (e.g. a commit SHA)"
        required: true
        type: string
    secrets:
      ITEMS_V3_CI_ROLE_ARN:
        description: "Role ARN to assume for updating the Lambda"
        required: true
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Image tag to deploy (e.g. a commit SHA)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Lambda rejects concurrent code updates, so serialise deploys.
concurrency:
  group: items-v3-deploy
  cancel-in-progress: false

jobs:
  deploy-items-v3-lambda:
    runs-on: ubuntu-latest
    # Deploys only from main. Pull requests never reach here, so there is no
    # need to guard on the role secret existing.
    if: github.ref == 'refs/heads/main'
    # Its own environment, not "stage", which is the identifiers deploy's:
    # Backplane tells deployments apart by environment and task, and both
    # would be task "deploy". The CI role trusts this name and Terraform
    # limits it to main (terraform/github), so the three change together.
    environment:
      name: items-v3-stage
      url: https://api-stage.wellcomecollection.org/catalogue/management/items-v3/manifest
    steps:
      - uses: wellcomecollection/.github/.github/actions/deploy-lambda-image@main
        with:
          lambda_name: items-v3-api-stage
          registry: 756629837203.dkr.ecr.eu-west-1.amazonaws.com/uk.ac.wellcome
          image_name: items_v3
          deploy_tag: ${{ inputs.deploy_tag }}
          role_to_assume: ${{ secrets.ITEMS_V3_CI_ROLE_ARN }}
